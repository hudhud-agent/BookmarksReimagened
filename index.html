<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookmarks</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --border: #e4e7ec;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --tag-bg: #f0f1f4;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --border: #2a2e36;
      --accent: #818cf8;
      --accent-soft: #1e2340;
      --tag-bg: #23272f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 650; }
  #count { color: var(--muted); font-size: 0.875rem; }
  .controls { display: flex; gap: 8px; flex: 1; min-width: 220px; flex-wrap: wrap; }
  input[type="search"] {
    flex: 1;
    min-width: 180px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  #tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tag-pill {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .tag-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    border-color: var(--accent);
  }
  .card-top { display: flex; align-items: center; gap: 10px; }
  .favicon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--tag-bg);
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 0.7rem;
    color: var(--muted);
    overflow: hidden;
  }
  .favicon img { width: 100%; height: 100%; object-fit: cover; }
  .title {
    font-weight: 600;
    font-size: 0.95rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .desc {
    color: var(--muted);
    font-size: 0.85rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .url {
    color: var(--accent);
    font-size: 0.75rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-tag {
    background: var(--tag-bg);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 0.95rem;
  }
  #status {
    font-size: 0.8rem;
    color: var(--muted);
    padding: 4px 0;
  }
  #status.error { color: #dc2626; }
  @media (max-width: 480px) {
    header { padding: 12px 16px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Bookmarks</h1>
    <span id="count"></span>
    <div class="controls">
      <input type="search" id="search" placeholder="Search bookmarks..." autocomplete="off" />
    </div>
  </div>
  <div class="header-inner" id="status"></div>
</header>
<main>
  <div id="tags"></div>
  <div id="grid"></div>
</main>
<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  // Point this at the raw JSON file in your public git repo.
  // For GitHub use: https://raw.githubusercontent.com/<user>/<repo>/<branch>/bookmarks.json
  const DATA_URL = "https://raw.githubusercontent.com/hudhud-agent/BookmarksReimagened/main/bookmarks.json";

  // ── State ───────────────────────────────────────────────────────────────
  let bookmarks = [];
  let query = "";
  let activeTag = null;

  // ── Helpers ─────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);

  function faviconUrl(url) {
    try {
      const { hostname } = new URL(url);
      return `https://www.google.com/s2/favicons?domain=${hostname}&sz=64`;
    } catch {
      return "";
    }
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  // ── Rendering ───────────────────────────────────────────────────────────
  function renderTags() {
    const counts = {};
    for (const b of bookmarks) {
      for (const t of (b.tags || [])) counts[t] = (counts[t] || 0) + 1;
    }
    const el = $("tags");
    el.innerHTML = Object.keys(counts).sort().map((t) => {
      const cls = t === activeTag ? "tag-pill active" : "tag-pill";
      return `<button class="${cls}" data-tag="${escapeHtml(t)}">${escapeHtml(t)} (${counts[t]})</button>`;
    }).join("");
    el.querySelectorAll(".tag-pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTag = activeTag === btn.dataset.tag ? null : btn.dataset.tag;
        renderTags();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const q = query.toLowerCase();
    const filtered = bookmarks.filter((b) => {
      const haystack = `${b.title} ${b.desc || ""} ${(b.tags || []).join(" ")} ${b.url}`.toLowerCase();
      const matchesQuery = !q || haystack.includes(q);
      const matchesTag = !activeTag || (b.tags || []).includes(activeTag);
      return matchesQuery && matchesTag;
    });

    const grid = $("grid");
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty">No bookmarks found.</div>`;
      $("count").textContent = "";
      return;
    }
    $("count").textContent = `${filtered.length} of ${bookmarks.length}`;
    grid.innerHTML = filtered.map((b) => {
      const title = escapeHtml(b.title || hostOf(b.url));
      const desc = b.desc ? escapeHtml(b.desc) : "";
      const tags = (b.tags || []).map((t) => `<span class="mini-tag">${escapeHtml(t)}</span>`).join("");
      const fav = b.icon || faviconUrl(b.url);
      return `
        <a class="card" href="${escapeHtml(b.url)}" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <div class="favicon">${fav ? `<img src="${fav}" alt="" loading="lazy" />` : "•"}</div>
            <div class="title">${title}</div>
          </div>
          ${desc ? `<div class="desc">${desc}</div>` : ""}
          <div class="url">${escapeHtml(hostOf(b.url))}</div>
          ${tags ? `<div class="card-tags">${tags}</div>` : ""}
        </a>`;
    }).join("");
  }

  // ── Data loading ────────────────────────────────────────────────────────
  async function load() {
    const status = $("status");
    status.textContent = "Loading bookmarks...";
    status.classList.remove("error");
    try {
      const res = await fetch(DATA_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      bookmarks = await res.json();
      if (!Array.isArray(bookmarks)) throw new Error("bookmarks.json must be a JSON array");
      renderTags();
      renderGrid();
      status.textContent = "Loaded.";
    } catch (err) {
      status.textContent = `Failed to load bookmarks: ${err.message}. Check DATA_URL in index.html.`;
      status.classList.add("error");
    }
  }

  $("search").addEventListener("input", (e) => {
    query = e.target.value.trim();
    renderGrid();
  });

  load();
</script>
</body>
</html>
